<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Stairs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============================== -->
  <!-- ホーム画面                      -->
  <!-- ============================== -->
  <main id="home" class="screen active">

    <!-- 上部：ロゴとログイン状態 -->
    <header class="topbar">
      <span class="brand">∞ / STAIRS</span>
      <button class="user-chip" data-open="accountDialog">
        <span id="userDot" class="dot"></span>
        <span id="userChip">ゲスト</span>
      </button>
    </header>

    <!-- メイン：タイトルとスタート -->
    <section class="hero">
      <p class="eyebrow"><span class="square"></span>An endless climb — 無限階段</p>

      <h1 class="title">
        <span class="thin">INFINITE</span>
        <span class="bold">STAIRS</span>
      </h1>

      <p id="leader" class="leader" hidden></p>

      <button id="startBtn" class="start">
        <span class="start-label">START</span>
        <span class="start-sub">ゲームスタート ／ Enter</span>
        <span class="start-arrow">→</span>
      </button>
      <p id="guestNote" class="note">ゲストで遊ぶと、スコアはランキングに残りません</p>

      <nav class="menu">
        <button data-open="howtoDialog"><i>01</i>遊び方</button>
        <button data-open="rankingDialog"><i>02</i>ランキング</button>
        <button data-open="accountDialog"><i>03</i>アカウント</button>
      </nav>
    </section>

    <!-- 飾りの階段（線で描いた階段） -->
    <svg class="deco" viewBox="0 0 400 620" aria-hidden="true">
      <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <line x1="102" y1="580" x2="138" y2="580"/>
        <line x1="136" y1="540" x2="172" y2="540"/>
        <line x1="170" y1="500" x2="206" y2="500"/>
        <line x1="204" y1="460" x2="240" y2="460"/>
        <line x1="238" y1="420" x2="274" y2="420"/>
        <line x1="204" y1="380" x2="240" y2="380"/>
        <line x1="170" y1="340" x2="206" y2="340"/>
        <line x1="136" y1="300" x2="172" y2="300"/>
        <line x1="170" y1="260" x2="206" y2="260"/>
        <line x1="204" y1="220" x2="240" y2="220"/>
        <line x1="238" y1="180" x2="274" y2="180"/>
        <line x1="272" y1="140" x2="308" y2="140"/>
        <line x1="238" y1="100" x2="274" y2="100"/>
        <line x1="204" y1="60" x2="240" y2="60"/>
      </g>
      <rect class="deco-player" x="214" y="203" width="16" height="16"/>
    </svg>
  </main>

  <!-- ============================== -->
  <!-- 小窓（ダイアログ）               -->
  <!-- ============================== -->

  <!-- 遊び方 -->
  <dialog id="howtoDialog" class="panel">
    <div class="panel-inner">
      <header class="panel-head">
        <h2><i>01</i>遊び方</h2>
        <button class="close" data-close>閉じる ×</button>
      </header>
      <ol class="howto">
        <li><span class="keys"><kbd>←</kbd><kbd>→</kbd></span>左上 ／ 右上の段へ1段登る</li>
        <li>次の段がない方向に進むと、落下してゲームオーバー</li>
        <li>上のゲージは残り時間。登ると回復し、0になっても落下</li>
        <li>高く登るほど時間の減りが速く、曲がり角も増えていく</li>
      </ol>
    </div>
  </dialog>

  <!-- ランキング -->
  <dialog id="rankingDialog" class="panel">
    <div class="panel-inner">
      <header class="panel-head">
        <h2><i>02</i>ランキング <small>TOP 10</small></h2>
        <button class="close" data-close>閉じる ×</button>
      </header>
      <ol id="rankingList" class="ranking"><li class="empty">読み込み中…</li></ol>
    </div>
  </dialog>

  <!-- アカウント -->
  <dialog id="accountDialog" class="panel">
    <div class="panel-inner">
      <header class="panel-head">
        <h2><i>03</i>アカウント</h2>
        <button class="close" data-close>閉じる ×</button>
      </header>

      <!-- ログアウト中に表示 -->
      <div id="loggedOut">
        <div class="tabs">
          <button class="tab active" data-tab="signupForm">新規登録</button>
          <button class="tab" data-tab="loginForm">ログイン</button>
        </div>

        <form id="signupForm" class="auth-form">
          <label><span>ニックネーム<small>ランキングに表示・12文字まで</small></span>
            <input id="signupName" type="text" maxlength="12" required>
          </label>
          <label><span>メールアドレス</span>
            <input id="signupEmail" type="email" autocomplete="email" required>
          </label>
          <label><span>パスワード<small>6文字以上</small></span>
            <input id="signupPassword" type="password" minlength="6" autocomplete="new-password" required>
          </label>
          <button type="submit" class="btn">登録する</button>
        </form>

        <form id="loginForm" class="auth-form" hidden>
          <label><span>メールアドレス</span>
            <input id="loginEmail" type="email" autocomplete="email" required>
          </label>
          <label><span>パスワード</span>
            <input id="loginPassword" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit" class="btn">ログイン</button>
        </form>
      </div>

      <!-- ログイン中に表示 -->
      <div id="loggedIn" hidden>
        <p class="welcome"><b id="userName"></b> さんでログイン中</p>
        <button id="logoutBtn" class="btn ghost">ログアウト</button>
      </div>

      <p id="authMsg" class="msg"></p>
    </div>
  </dialog>

  <!-- ============================== -->
  <!-- ゲーム画面                      -->
  <!-- ============================== -->
  <div id="game" class="screen">
    <div class="game-wrap">
      <canvas id="canvas"></canvas>

      <!-- スマホ用ボタン（PCでも押せます） -->
      <div class="touch">
        <button class="touch-btn" data-dir="-1">←</button>
        <button class="touch-btn" data-dir="1">→</button>
      </div>

      <!-- ゲームオーバー表示 -->
      <div id="overlay" class="overlay" hidden>
        <div class="overlay-box">
          <p id="reason" class="reason"></p>
          <h2>GAME OVER</h2>
          <p class="final"><span id="finalScore">0</span>段</p>
          <p id="saveMsg" class="msg"></p>
          <div class="overlay-btns">
            <button id="retryBtn" class="btn">もう一度 (Enter)</button>
            <button id="homeBtn" class="btn ghost">ホームへ</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- type="module" にすると import が使えます -->
  <script type="module" src="main.js"></script>
</body>
</html>
